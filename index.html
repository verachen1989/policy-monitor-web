76d145c5993b3bcc","title":"关于调整住房公积金贷款有关政策的通知","original_date":"2026-09-18","repost_date":null,"channel":"fund","channel_label":"公积金","complete":true,"url":"https://www.sjzgjj.cn/tzgg/2489.jhtml","attachment_count":1}],"topic_ids":["support_fund_loan_limit","support_fund_eligibility"],"topic_details":{"support_fund_loan_limit":{"version_id":"eb93276b3ab647ff76d145c5993b3bcc","scope":"石家庄","title":"关于调整住房公积金贷款有关政策的通知","original_date":"2026-09-18","summary":"1\n \n石家庄住房公积金管理中心 \n关于调整住房公积金贷款有关政策的通知 \n \n各缴存单位、缴存人： \n为更好发挥住房公积金住房保障作用，减轻缴存人住房消\n费压力，满足缴存人刚性及改善型住房需求，助力我市房地产\n市场平稳健康发展，结合我市实际，经石家庄住房公积金管理\n委员会审议通过，现就调整住房公积金贷款政策有关事项通知\n如下： \n一、调整住房公积金贷款最高额度 \n（一）缴存人家庭购买长安区、桥西区、新华区、裕华区、\n高新区住房，单方缴存最高贷款额度100万元，双方缴存最高贷\n款额度120万元； \n缴存人家庭购买经济技术开发区、鹿泉区、栾城区、藁城\n区及正定县住房，单方缴存最高贷款额度80万元，双方缴存最高\n贷款额度100万元； \n缴存人家庭购买晋州市、新乐市、井陉县、无极县、深泽\n县、行唐县、灵寿县、平山县、赵县、元氏县、高邑县、赞皇\n县、井陉矿区住房，单方缴存最高贷款额度60万元，双方缴存最\n高贷款额度80万元。 \n（二）缴存人家庭购买商品住房现房的，最高贷款额度在\n2\n现行政策基础上提高20万元。 \n二、阶段性优化住房套数认定范围 \n缴存人家庭购买长安区、桥西区、新华区、裕华区、高新\n区范围内自住住房的，其住房套数按拟购住房所在区认定。 \n三、阶段性优化住房套数认定标准 \n（一）住房套数认定标准按以下规定执行： \n1.缴存人家庭存在以下情形之一的，可核减一套住房套数： \n（1）多子女家庭的； \n（2）持有效石家庄市人才绿卡A卡、B卡的； \n（3）购买二星级及以上新建绿色建筑或被动式超低能耗住\n房的。 \n同时符合多种情形的，仅核减一套，不叠加核减。 \n2.执行核减政策后，缴存人家庭在拟购住房所在县（市、\n区）住房套数仍认定为两套及以上的，不予受理住房公积金贷\n款申请。 \n（二）缴存人家庭全国范围内无未结清住房公积金贷款，\n且按照上述规定准予贷款的，执行首套房贷款政策。 \n四、规范非城镇住宅用地住房信贷管理 \n（一）缴存人家庭自有宅基地自建住房，不纳入住房套数\n统计。 \n（二）缴存人家庭购买非住宅建设用地上住房申请公积金\n贷款的，贷款额度不超过房屋总价的50%。","scope_label":"石家庄","policy_id":"7779d67f573c5ff0612390625ab90357","personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"},"support_fund_eligibility":{"version_id":"eb93276b3ab647ff76d145c5993b3bcc","scope":"石家庄","title":"关于调整住房公积金贷款有关政策的通知","original_date":"2026-09-18","summary":"2\n现行政策基础上提高20万元。 \n二、阶段性优化住房套数认定范围 \n缴存人家庭购买长安区、桥西区、新华区、裕华区、高新\n区范围内自住住房的，其住房套数按拟购住房所在区认定。 \n三、阶段性优化住房套数认定标准 \n（一）住房套数认定标准按以下规定执行： \n1.缴存人家庭存在以下情形之一的，可核减一套住房套数： \n（1）多子女家庭的； \n（2）持有效石家庄市人才绿卡A卡、B卡的； \n（3）购买二星级及以上新建绿色建筑或被动式超低能耗住\n房的。 \n同时符合多种情形的，仅核减一套，不叠加核减。 \n2.执行核减政策后，缴存人家庭在拟购住房所在县（市、\n区）住房套数仍认定为两套及以上的，不予受理住房公积金贷\n款申请。 \n（二）缴存人家庭全国范围内无未结清住房公积金贷款，\n且按照上述规定准予贷款的，执行首套房贷款政策。 \n四、规范非城镇住宅用地住房信贷管理 \n（一）缴存人家庭自有宅基地自建住房，不纳入住房套数\n统计。 \n（二）缴存人家庭购买非住宅建设用地上住房申请公积金\n贷款的，贷款额度不超过房屋总价的50%。","scope_label":"石家庄","policy_id":"7779d67f573c5ff0612390625ab90357","personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"}},"record_kind":"policy","formal_policy_count":1,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"local","scope_label":"石家庄","personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"},{"version_id":"825d2f6572d77477a9ae4d5507a04417","title":"关于开展装修提取住房公积金业务的通知","scope":"石家庄","issuer":null,"doc_no":null,"nature":"formal","complete":true,"original_date":"2026-09-18","repost_date":null,"effective_date":null,"source_url":"https://www.sjzgjj.cn/tzgg/2488.jhtml","reference_cities":[],"collection_track":"delta","issued_date":null,"source_issuer":"石家庄住房公积金管理中心","channels":["fund"],"policy_id":"563dc1cfefbba1c8c137b33c353eb8cc","source_conflict":false,"official_sources":[{"version_id":"825d2f6572d77477a9ae4d5507a04417","title":"关于开展装修提取住房公积金业务的通知","original_date":"2026-09-18","repost_date":null,"channel":"fund","channel_label":"公积金","complete":true,"url":"https://www.sjzgjj.cn/tzgg/2488.jhtml","attachment_count":1}],"topic_ids":["support_renovation_withdrawal"],"topic_details":{"support_renovation_withdrawal":{"version_id":"825d2f6572d77477a9ae4d5507a04417","scope":"石家庄","title":"关于开展装修提取住房公积金业务的通知","original_date":"2026-09-18","summary":"石家庄住房公积金管理中心关于开展装修提取住房公积金业务的通知.pdf\n1\n \n \n石家庄住房公积金管理中心 \n关于开展装修提取住房公积金业务的通知 \n \n各缴存单位、缴存人： \n为进一步满足缴存人多样化住房消费需求，根据《住房公\n积金管理条例》有关规定，结合我市实际，经石家庄住房公积\n金管理委员会审议通过，现就开展支持自住住房装修提取住房\n公积金业务有关事项通知如下： \n一、适用范围 \n缴存人本人及其配偶对自住住房进行装修，符合下列条件\n之一的，可申请装修提取住房公积金： \n（一）在本市行政区域内且取得不动产权证书或房屋所有\n权证满 10 年的自住住房； \n（二）2026 年 9 月20日（含）以后，在本市行政区域内取\n得不动产权证书的自住住房。 \n二、提取额度 \n每个缴存人只可申请一次装修提取，提取金额最高不超过\n15 万元。 \n三、注意事项 \n（一）同一套住房在房产持有期间最多允许两人办理装修\n提取。 \n（二）申请装修提取的自住住房，房产取得时间以证件登\n记时间为准。因补发、变更、析产等原因换发不动产权证书的，","scope_label":"石家庄","policy_id":"563dc1cfefbba1c8c137b33c353eb8cc","personal_key":"family:081ddaf9466f63aee39cd4e2e5f731643ae99e5240515b5234f712143d11cda7"}},"record_kind":"policy","formal_policy_count":1,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"local","scope_label":"石家庄","personal_key":"family:081ddaf9466f63aee39cd4e2e5f731643ae99e5240515b5234f712143d11cda7"},{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","scope":"国家","issuer":"住房和城乡建设部、自然资源部、金融监管总局","doc_no":"建房规〔2026〕3号","nature":"formal","complete":true,"original_date":"2026-08-28","repost_date":"2026-09-08","effective_date":"2026-08-28","source_url":"https://www.hunan.gov.cn/zqt/zcsd/202609/t20260907_34057926.html","reference_cities":["北京","天津","石家庄","三亚","陵水"],"collection_track":"delta","issued_date":"2026-08-28","source_issuer":"住房和城乡建设部、自然资源部、金融监管总局","channels":["national"],"policy_id":"6ff71443c8a24f78f7b64d4b840c194a","source_conflict":false,"official_sources":[{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","repost_date":"2026-09-08","channel":"national","channel_label":"国家部委","complete":true,"url":"https://www.hunan.gov.cn/zqt/zcsd/202609/t20260907_34057926.html","attachment_count":0}],"topic_ids":["implementation_rules","sheet_row_10","sheet_row_11","sheet_row_17","sheet_row_21","sheet_row_22","sheet_row_23","sheet_row_34","sheet_row_45"],"topic_details":{"implementation_rules":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"为贯彻落实党中央、国务院关于加快构建房地产发展新模式的决策部署,坚持稳中求进、先立后破,稳步推进商品住房销售制度改革,现就有关事项通知如下。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_10":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)优化存量项目预售管理。本通知施行之日前已取得建设工程规划许可证的商品住房项目,实行预售的,预售条件、预售资金监管等按原有政策规定执行。应合理确定监管额度,优化预售资金使用,严格预售资金监管,保障预售资金安全。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_11":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)优化存量项目预售管理。本通知施行之日前已取得建设工程规划许可证的商品住房项目,实行预售的,预售条件、预售资金监管等按原有政策规定执行。应合理确定监管额度,优化预售资金使用,严格预售资金监管,保障预售资金安全。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_17":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"各地要规范商品住房预售条件,加强预售资金监管,保障预售资金安全,有效防范商品住房交付风险,维护购房人合法权益。\n(一)规范预售条件。商品住房项目实行预售的,单体建筑应完成主体结构封顶,具体条件由各地根据实际情况确定。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_21":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(一)推进商品住房现房销售。本通知施行之日起,新出让土地的商品住房项目和已出让土地未取得建设工程规划许可证的商品住房项目,优先选择现房销售;已取得建设工程规划许可证的商品住房项目,鼓励实行现房销售。\n(一)优化土地供应管理。市县要优化国土空间规划和土地利用方式,按照住房发展规划和年度计划,合理确定房地产用地供应规模。统筹规划、合理布局商品住宅用地,优化土地出让方案,可带规划方案出让。房地产开发企业须用自有资金购地,可按国家规定分期缴纳土地出让价款,具体缴纳比例和时限由市县人民政府确定。对于实行现房销售的项目,在土地出让公告中向社会公开现房销售相关信息。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_22":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(一)推进商品住房现房销售。本通知施行之日起,新出让土地的商品住房项目和已出让土地未取得建设工程规划许可证的商品住房项目,优先选择现房销售;已取得建设工程规划许可证的商品住房项目,鼓励实行现房销售。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_23":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)推行现房销售定金制。实行现房销售的商品住房项目,在取得建筑工程施工许可证后,房地产开发企业可与购房人签订购房定金合同,依法收取少量定金。购房定金合同应约定定金金额、商品住房售价、交付时间及不能按期履约的责任等,保护双方合法权益。市县住房和城乡建设部门履行定金监管职责,住房资金监管机构承担定金监管工作,在项目的主办银行开立定金监管账户。房屋具备交付条件后,解除定金监管。房地产开发企业违约不能按期交房的,购房人有权按照合同约定提出解除定金合同,房地产开发企业依法返还定金,承担违约责任。各地要结合实际制定购房定金合同示范文本。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_34":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"各地要规范商品住房预售条件,加强预售资金监管,保障预售资金安全,有效防范商品住房交付风险,维护购房人合法权益。\n(二)加强预售资金监管。市县住房和城乡建设部门履行预售资金监管职责,由住房资金监管机构承担具体监管工作。住房资金监管机构应与房地产开发企业签订资金监管协议,并在项目的主办银行开立资金监管账户。购房人支付的首付款、个人住房贷款等购房资金应全部存入资金监管账户。商品住房项目竣工验收、水电气热等配套设施具备交付条件后,解除资金监管。房地产开发企业违约不能按期交房的,购房人有权按照合同约定提出解除购房合同,房地产开发企业须按照合同约定退还购房资金并承担违约责任。房地产开发企业应与购房人在购房合同中约定购房资金存入资金监管账户的相关权利责任。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_45":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(二)加大融资支持力度。房地产项目实行主办银行制,房地产项目开发公司和主办银行双向选择,一个项目确定一家主办银行,主办银行单独或牵头组建银团提供开发贷款等融资服务。房地产项目开发公司以土地使用权抵押申请开发贷款的,应以分户土地使用权集合设定抵押,相关办法另行制定。支持房地产项目开发公司通过股权、债券等多种方式开展融资。对实行现房销售和预售的项目,按照市场化原则满足项目合理融资需求,实现开发贷款发放与项目建设周期相匹配。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"}},"record_kind":"policy","formal_policy_count":1,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"national","scope_label":"国家基准 / 参考","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},{"version_id":"3c6f215d75206983efc14407d24560ff","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","scope":"国家","issuer":"中国人民银行、国家金融监督管理总局","doc_no":"银发〔2026〕171号","nature":"formal","complete":true,"original_date":"2026-08-28","repost_date":"2026-09-08","effective_date":"2026-08-28","source_url":"https://hunan.gov.cn/zqt/zcsd/202609/t20260907_34058152.html","reference_cities":["北京","天津","石家庄","三亚","陵水"],"collection_track":"delta","issued_date":"2026-08-28","source_issuer":"中国人民银行、国家金融监督管理总局","channels":["national"],"policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","source_conflict":false,"official_sources":[{"version_id":"3c6f215d75206983efc14407d24560ff","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","repost_date":"2026-09-08","channel":"national","channel_label":"国家部委","complete":true,"url":"https://hunan.gov.cn/zqt/zcsd/202609/t20260907_34058152.html","attachment_count":0}],"topic_ids":["sheet_row_18","sheet_row_19","sheet_row_23","sheet_row_34","sheet_row_45"],"topic_details":{"sheet_row_18":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"第二十二条 所购新建住房实行现房销售的,个人住房贷款应在销售备案后发放;实行预售的,应严格在项目竣工备案后发放。\n个人住房贷款应通过受托支付方式发放。对实行现房销售的,受托支付至项目公司在主办银行开立的资金账户;对实行预售的,受托支付至项目预售资金监管账户。所购住房为再交易住房的,受托支付至贷款合同约定的借款人交易对象账户。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_19":{"version_id":"3c6f21 京","title":"北京市住房和城乡建设委员会等4部门关于发布本市贯彻落实《关于完善商品住房销售制度的通知》的实施意见","original_date":"2026-09-24","summary":"实行现房销售的商品住房项目，房地产开发企业可 在取得建筑工程施工许可证后， 与购房人签订购房定金合同， 一般 收取不超过总房价款1%的定金。房地产开发企业违约不能按期交房的，购房人有权按照合同约定提出解除定金合同。\n房地产开发企业在主办银行开立资金账户，项目存续期间，开发贷款、项目自有资金、现房销售资金等与项目相关的全部资金均应纳入在主办银行开立的资金账户管理。市住房资金管理中心在主办银行开立资金监管账户，用于存放监管项目预售资金和现房定金。","scope_label":"北京","policy_id":"07299f8a93fb02d4cb6954cddae14844","personal_key":"family:1751a146d5d3518f2aac2297df4afb2c4816926a738acc4cdf81542b9f60a0c3"},"sheet_row_31":{"version_id":"c24d5666fe87fe9c3bd266ce78e8e07b","scope":"北京","title":"北京市住房和城乡建设委员会等4部门关于发布本市贯彻落实《关于完善商品住房销售制度的通知》的实施意见","original_date":"2026-09-24","summary":"2026年8月28日后 发布出让公告的商品住宅用地，出让价款可按国家规定分期缴纳，首付款在出让合同签订之日起30个自然日内缴纳，缴纳比例不低于总价款的50%，余款可延长至出让合同签订后两年内缴清，不计利息。","scope_label":"北京","policy_id":"07299f8a93fb02d4cb6954cddae14844","personal_key":"family:1751a146d5d3518f2aac2297df4afb2c4816926a738acc4cdf81542b9f60a0c3"},"sheet_row_34":{"version_id":"c24d5666fe87fe9c3bd266ce78e8e07b","scope":"北京","title":"北京市住房和城乡建设委员会等4部门关于发布本市贯彻落实《关于完善商品住房销售制度的通知》的实施意见","original_date":"2026-09-24","summary":"（一）新取得土地项目。 2026年8月28日后 新发布国有 建设用地 使用权出让公告的商品住房项目， 申请 预售 的 ，单体建筑 应 完成主体结构封顶 （楼栋顶板及楼顶构筑物、配套设施完成混凝土浇筑）， 项目 建设单位、勘察、设计、施工、监理 等单位 应出具 签字 盖章 的《主体结构分部工程验收记录》 。项目 预售资金全额 、全过程监管 ，项目 联合验收后 ， 方可 解除资金监管。 具体预售资金监管办法另行印发。\n（二）在途项目。 2026年8月28日（含）前，已取得 （含部分取得） 建设工程规划许可证但未办理预售许可的商品住房项目 ，申请 预售的，预售条件、预售资金监管等按原有政策规定执行。","scope_label":"北京","policy_id":"07299f8a93fb02d4cb6954cddae14844","personal_key":"family:1751a146d5d3518f2aac2297df4afb2c4816926a738acc4cdf81542b9f60a0c3"},"sheet_row_45":{"version_id":"c24d5666fe87fe9c3bd266ce78e8e07b","scope":"北京","title":"北京市住房和城乡建设委员会等4部门关于发布本市贯彻落实《关于完善商品住房销售制度的通知》的实施意见","original_date":"2026-09-24","summary":"2026年8月28日后签订开发贷合同的商品住房项目，贷款银行单独提供开发贷的，贷款银行为主办银行；贷款银行组建银团提供贷款的， 银团贷款牵头银行为主办银行 。","scope_label":"北京","policy_id":"07299f8a93fb02d4cb6954cddae14844","personal_key":"family:1751a146d5d3518f2aac2297df4afb2c4816926a738acc4cdf81542b9f60a0c3"},"sheet_row_46":{"version_id 庄","title":"关于调整住房公积金贷款有关政策的通知","original_date":"2026-09-18","summary":"1\n \n石家庄住房公积金管理中心 \n关于调整住房公积金贷款有关政策的通知 \n \n各缴存单位、缴存人： \n为更好发挥住房公积金住房保障作用，减轻缴存人住房消\n费压力，满足缴存人刚性及改善型住房需求，助力我市房地产\n市场平稳健康发展，结合我市实际，经石家庄住房公积金管理\n委员会审议通过，现就调整住房公积金贷款政策有关事项通知\n如下： \n一、调整住房公积金贷款最高额度 \n（一）缴存人家庭购买长安区、桥西区、新华区、裕华区、\n高新区住房，单方缴存最高贷款额度100万元，双方缴存最高贷\n款额度120万元； \n缴存人家庭购买经济技术开发区、鹿泉区、栾城区、藁城\n区及正定县住房，单方缴存最高贷款额度80万元，双方缴存最高\n贷款额度100万元； \n缴存人家庭购买晋州市、新乐市、井陉县、无极县、深泽\n县、行唐县、灵寿县、平山县、赵县、元氏县、高邑县、赞皇\n县、井陉矿区住房，单方缴存最高贷款额度60万元，双方缴存最\n高贷款额度80万元。 \n（二）缴存人家庭购买商品住房现房的，最高贷款额度在\n2\n现行政策基础上提高20万元。 \n二、阶段性优化住房套数认定范围 \n缴存人家庭购买长安区、桥西区、新华区、裕华区、高新\n区范围内自住住房的，其住房套数按拟购住房所在区认定。 \n三、阶段性优化住房套数认定标准 \n（一）住房套数认定标准按以下规定执行： \n1.缴存人家庭存在以下情形之一的，可核减一套住房套数： \n（1）多子女家庭的； \n（2）持有效石家庄市人才绿卡A卡、B卡的； \n（3）购买二星级及以上新建绿色建筑或被动式超低能耗住\n房的。 \n同时符合多种情形的，仅核减一套，不叠加核减。 \n2.执行核减政策后，缴存人家庭在拟购住房所在县（市、\n区）住房套数仍认定为两套及以上的，不予受理住房公积金贷\n款申请。 \n（二）缴存人家庭全国范围内无未结清住房公积金贷款，\n且按照上述规定准予贷款的，执行首套房贷款政策。 \n四、规范非城镇住宅用地住房信贷管理 \n（一）缴存人家庭自有宅基地自建住房，不纳入住房套数\n统计。 \n（二）缴存人家庭购买非住宅建设用地上住房申请公积金\n贷款的，贷款额度不超过房屋总价的50%。","scope_label":"石家庄","policy_id":"7779d67f573c5ff0612390625ab90357","personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"},"support_fund_eligibility":{"version_id":"eb93276b3ab647ff76d145c5993b3bcc","scope":"石家庄","title":"关于调整住房公积金贷款有关政策的通知","original_date":"2026-09-18","summary":"2\n现行政策基础上提高20万元。 \n二、阶段性优化住房套数认定范围 \n缴存人家庭购买长安区、桥西区、新华区、裕华区、高新\n区范围内自住住房的，其住房套数按拟购住房所在区认定。 \n三、阶段性优化住房套数认定标准 \n（一）住房套数认定标准按以下规定执行： \n1.缴存人家庭存在以下情形之一的，可核减一套住房套数： \n（1）多子女家庭的； \n（2）持有效石家庄市人才绿卡A卡、B卡的； \n（3）购买二星级及以上新建绿色建筑或被动式超低能耗住\n房的。 \n同时符合多种情形的，仅核减一套，不叠加核减。 \n2.执行核减政策后，缴存人家庭在拟购住房所在县（市、\n区）住房套数仍认定为两套及以上的，不予受理住房公积金贷\n款申请。 \n（二）缴存人家庭全国范围内无未结清住房公积金贷款，\n且按照上述规定准予贷款的，执行首套房贷款政策。 \n四、规范非城镇住宅用地住房信贷管理 \n（一）缴存人家庭自有宅基地自建住房，不纳入住房套数\n统计。 \n（二）缴存人家庭购买非住宅建设用地上住房申请公积金\n贷款的，贷款额度不超过房屋总价的50%。","scope_label":"石家庄","policy_id":"7779d67f573c5ff0612390625ab90357","personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"}},"summary":"一、调整住房公积金贷款最高额度 \n（一 ":"石家庄","title":"关于开展装修提取住房公积金业务的通知","original_date":"2026-09-18","summary":"石家庄住房公积金管理中心关于开展装修提取住房公积金业务的通知.pdf\n1\n \n \n石家庄住房公积金管理中心 \n关于开展装修提取住房公积金业务的通知 \n \n各缴存单位、缴存人： \n为进一步满足缴存人多样化住房消费需求，根据《住房公\n积金管理条例》有关规定，结合我市实际，经石家庄住房公积\n金管理委员会审议通过，现就开展支持自住住房装修提取住房\n公积金业务有关事项通知如下： \n一、适用范围 \n缴存人本人及其配偶对自住住房进行装修，符合下列条件\n之一的，可申请装修提取住房公积金： \n（一）在本市行政区域内且取得不动产权证书或房屋所有\n权证满 10 年的自住住房； \n（二）2026 年 9 月20日（含）以后，在本市行政区域内取\n得不动产权证书的自住住房。 \n二、提取额度 \n每个缴存人只可申请一次装修提取，提取金额最高不超过\n15 万元。 \n三、注意事项 \n（一）同一套住房在房产持有期间最多允许两人办理装修\n提取。 \n（二）申请装修提取的自住住房，房产取得时间以证件登\n记时间为准。因补发、变更、析产等原因换发不动产权证书的，","scope_label":"石家庄","policy_id":"563dc1cfefbba1c8c137b33c353eb8cc","personal_key":"family:081ddaf9466f63aee39cd4e2e5f731643ae99e5240515b5234f712143d11cda7"}},"summary":"一、适用范围 \n缴存人本人及其配偶对自住住房进行装修，符合下列条件\n之一的，可申请装修提取住房公积金： \n（一）在本市行政区域内且取得不动产权证书或房屋所有\n权证满 10 年的自住住房； \n（二）2026 年 9 月20日（含）以后，在本市行政区域内取\n得不动产权证书的自住住房。 \n二、提取额度 \n每个缴存人只可申请一次装修提取，提取金额最高不超过\n15 万元。 \n三、注意事项 \n（一）同一套住房在房产持有期间最多允许两人办理装修\n提取。 \n（二）申请装修提取的自住住房，房产取得时间以证件登\n记时间为准。因补发、变更、析产等原因换发不动产权证书的，\n\n房产取得时间以产权人首次取得该套住房的登记时间认定。 \n四、办理方式 \n（一）线下窗口办理 \n缴存人需提供不动产权证书或房屋所有权证、本人有效身\n份证件、Ⅰ类银行卡（现支持工商、农业、中国、建设、交通\n银行）申请办理；作为配偶提取的，另需提供产权人有效身份\n证件及婚姻关系证明材料。 \n（二）线上全程网办 \n能够通过信息联网核查提取条件的，可通过“手机公积金”\nAPP 全程网上办理。 \n五、施行日期 \n本通知自 2026 年 9 月 20 日起施行，此前有关规定与本通\n知不一致的，以本通知为准。","summary_available":true,"library_status":"mapped","library_status_label":"已关联事项","source_conflict":false,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"local","scope_label":"石家庄","record_kind":"policy","formal_policy_count":1,"parent_policy_id":null,"personal_key":"family:081ddaf9466f63aee39cd4e2e5f731643ae99e5240515b5234f712143d11cda7"},{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","scope":"国家","issuer":"住房和城乡建设部、自然资源部、金融监管总局","doc_no":"建房规〔2026〕3号","nature":"formal","complete":true,"original_date":"2026-08-28","repost_date":"2026-09-08","effective_date":"2026-08-28","source_url":"https://www.hunan.gov.cn/zqt/zcsd/202609/t20260907_34057926.html","collection_track":"delta","issued_date":"2026-08-28","source_issuer":"住房和城乡建设部、自然资源部、金融监管总局","date_eligible":true,"policy_id":"6ff71443c8a24f78f7b64d4b840c194a","reference_cities":["北京","天津","石家庄","三亚","陵水"],"channels":["national"],"official_sources":[{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","repost_date":"2026-09-08","channel":"national","channel_label":"国家部委","complete":true,"url":"https://www.hunan.gov.cn/zqt/zcsd/202609/t20260907_34057926.html","attachment_count":0}],"topic_ids":["implementation_rules","sheet_row_10","sheet_row_11","sheet_row_17","sheet_row_21","sheet_row_22","sheet_row_23","sheet_row_34","sheet_row_45"],"topic_details":{"implementation_rules":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"为贯彻落实党中央、国务院关于加快构建房地产发展新模式的决策部署,坚持稳中求进、先立后破,稳步推进商品住房销售制度改革,现就有关事项通知如下。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_10":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)优化存量项目预售管理。本通知施行之日前已取得建设工程规划许可证的商品住房项目,实行预售的,预售条件、预售资金监管等按原有政策规定执行。应合理确定监管额度,优化预售资金使用,严格预售资金监管,保障预售资金安全。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_11":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)优化存量项目预售管理。本通知施行之日前已取得建设工程规划许可证的商品住房项目,实行预售的,预售条件、预售资金监管等按原有政策规定执行。应合理确定监管额度,优化预售资金使用,严格预售资金监管,保障预售资金安全。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_17":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"各地要规范商品住房预售条件,加强预售资金监管,保障预售资金安全,有效防范商品住房交付风险,维护购房人合法权益。\n(一)规范预售条件。商品住房项目实行预售的,单体建筑应完成主体结构封顶,具体条件由各地根据实际情况确定。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_21":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(一)推进商品住房现房销售。本通知施行之日起,新出让土地的商品住房项目和已出让土地未取得建设工程规划许可证的商品住房项目,优先选择现房销售;已取得建设工程规划许可证的商品住房项目,鼓励实行现房销售。\n(一)优化土地供应管理。市县要优化国土空间规划和土地利用方式,按照住房发展规划和年度计划,合理确定房地产用地供应规模。统筹规划、合理布局商品住宅用地,优化土地出让方案,可带规划方案出让。房地产开发企业须用自有资金购地,可按国家规定分期缴纳土地出让价款,具体缴纳比例和时限由市县人民政府确定。对于实行现房销售的项目,在土地出让公告中向社会公开现房销售相关信息。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_22":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(一)推进商品住房现房销售。本通知施行之日起,新出让土地的商品住房项目和已出让土地未取得建设工程规划许可证的商品住房项目,优先选择现房销售;已取得建设工程规划许可证的商品住房项目,鼓励实行现房销售。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_23":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)推行现房销售定金制。实行现房销售的商品住房项目,在取得建筑工程施工许可证后,房地产开发企业可与购房人签订购房定金合同,依法收取少量定金。购房定金合同应约定定金金额、商品住房售价、交付时间及不能按期履约的责任等,保护双方合法权益。市县住房和城乡建设部门履行定金监管职责,住房资金监管机构承担定金监管工作,在项目的主办银行开立定金监管账户。房屋具备交付条件后,解除定金监管。房地产开发企业违约不能按期交房的,购房人有权按照合同约定提出解除定金合同,房地产开发企业依法返还定金,承担违约责任。各地要结合实际制定购房定金合同示范文本。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_34":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"各地要规范商品住房预售条件,加强预售资金监管,保障预售资金安全,有效防范商品住房交付风险,维护购房人合法权益。\n(二)加强预售资金监管。市县住房和城乡建设部门履行预售资金监管职责,由住房资金监管机构承担具体监管工作。住房资金监管机构应与房地产开发企业签订资金监管协议,并在项目的主办银行开立资金监管账户。购房人支付的首付款、个人住房贷款等购房资金应全部存入资金监管账户。商品住房项目竣工验收、水电气热等配套设施具备交付条件后,解除资金监管。房地产开发企业违约不能按期交房的,购房人有权按照合同约定提出解除购房合同,房地产开发企业须按照合同约定退还购房资金并承担违约责任。房地产开发企业应与购房人在购房合同中约定购房资金存入资金监管账户的相关权利责任。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_45":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(二)加大融资支持力度。房地产项目实行主办银行制,房地产项目开发公司和主办银行双向选择,一个项目确定一家主办银行,主办银行单独或牵头组建银团提供开发贷款等融资服务。房地产项目开发公司以土地使用权抵押申请开发贷款的,应以分户土地使用权集合设定抵押,相关办法另行制定。支持房地产项目开发公司通过股权、债券等多种方式开展融资。对实行现房销售和预售的项目,按照市场化原则满足项目合理融资需求,实现开发贷款发放与项目建设周期相匹配。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"}},"summary":"为贯彻落实党中央、国务院关于加快构建房地产发展新模式的决策部署,坚持稳中求进、先立后破,稳步推进商品住房销售制度改革,现就有关事项通知如下。\n\n各地要规范商品住房预售条件,加强预售资金监管,保障预售资金安全,有效防范商品住房交付风险,维护购房人合法权益。","summary_available":true,"library_status":"mapped","library_status_label":"已关联事项","source_conflict":false,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"national","scope_label":"国家基准 / 参考","record_kind":"policy","formal_policy_count":1,"parent_policy_id":null,"personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},{"version_id":"3c6f215d75206983efc14407d24560ff","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","scope":"国家","issuer":"中国人民银行、国家金融监督管理总局","doc_no":"银发〔2026〕171号","nature":"formal","complete":true,"original_date":"2026-08-28","repost_date":"2026-09-08","effective_date":"2026-08-28","source_url":"https://hunan.gov.cn/zqt/zcsd/202609/t20260907_34058152.html","collection_track":"delta","issued_date":"2026-08-28","source_issuer":"中国人民银行、国家金融监督管理总局","date_eligible":true,"policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","reference_cities":["北京","天津","石家庄","三亚","陵水"],"channels":["national"],"official_sources":[{"version_id":"3c6f215d75206983efc14407d24560ff","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","repost_date":"2026-09-08","channel":"national","channel_label":"国家部委","complete":true,"url":"https://hunan.gov.cn/zqt/zcsd/202609/t20260907_34058152.html","attachment_count":0}],"topic_ids":["sheet_row_18","sheet_row_19","sheet_row_23","sheet_row_34","sheet_row_45"],"topic_details":{"sheet_row_18":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"第二十二条 所购新建住房实行现房销售的,个人住房贷款应在销售备案后发放;实行预售的,应严格在项目竣工备案后发放。\n个人住房贷款应通过受托支付方式发放。对实行现房销售的,受托支付至项目公司在主办银行开立的资金账户;对实行预售的,受托支付至项目预售资金监管账户。所购住房为再交易住房的,受托支付至贷款合同约定的借款人交易对象账户。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_19":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"第二十二条 所购新建住房实行现房销售的,个人住房贷款应在销售备案后发放;实行预售的,应严格在项目竣工备案后发放。\n个人住房贷款应通过受托支付方式发放。对实行现房销售的,受托支付至项目公司在主办银行开立的资金账户;对实行预售的,受托支付至项目预售资金监管账户。所购住房为再交易住房的,受托支付至贷款合同约定的借款人交易对象账户。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_23":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"项目公司应在主办银行开立资金账户。项目存续期间,除按规定要求监管的预售资金、定金等外,房地产开发贷款、项目自有资金、现房销售资金等与项目相关的全部资金均应纳入在主办银行开立的资金账户管理。主办银行和资金账户在房地产开发贷款结清前原则上不得变更。\n项目预售资金监管账户和定金账户应按规定在主办银行开立。项目公司对外负债、投资等影响金融债务安全的重大事项,应事先告知主办银行。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_34":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"项目公司应在主办银行开立资金账户。项目存续期间,除按规定要求监管的预售资金、定金等外,房地产开发贷款、项目自有资金、现房销售资金等与项目相关的全部资金均应纳入在主办银行开立的资金账户管理。主办银行和资金账户在房地产开发贷款结清前原则上不得变更。\n项目预售资金监管账户和定金账户应按规定在主办银行开立。项目公司对外负债、投资等影响金融债务安全的重大事项,应事先告知主办银行。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_45":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"第十二条 房地产开发贷款实行主办银行制,单个房地产项目对应一家银行作为主办银行(单家贷款行或银团贷款牵头行),对项目资金进行封闭管理。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"}},"summary":"为深入贯彻落实党中央、国务院关于构建房地产发展新模式的决策部署,完善房地产信贷管理,维护购房人合法权益,满足行业合理融资需求,促进房地产市场稳健运行,现将《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》印发给你们,请遵照执行。\n\n第一条 为完善房地产信贷管理,维护购房人合法权益,满足行业合理融资需求,促进房地产市场稳健运行,加快构建房地产发展新模式,推动房地产高质量发展,根据《中华人民共和国中国人民银行法》《中华人民共和国银行业监督管理法》《中华人民共和国商业银行法》等法律法规,制定本意见。","summary_available":true,"library_status":"mapped","library_status_label":"已关联事项","source_conflict":false,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"national","scope_label":"国家基准 / 参考","record_kind":"policy","formal_policy_count":1,"parent_policy_id":null,"personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"}],"references":[{"version_id":"1616f5f394b30424c1f630dbf217b882","title":"住房公积金贷款政策解读","scope":"石家庄","issuer":null,"doc_no":null,"nature":"explanation","complete":true,"original_date":"2026-09-18","repost_date":null,"effective_date":null,"source_url":"https://www.sjzgjj.cn/zecjd/2491.jhtml","collection_track":"delta","issued_date":null,"source_issuer":"石家庄住房公积金管理中心","date_eligible":true,"policy_id":"f1bd2e5af0fdb3d8853ef627ac568e52","reference_cities":[],"channels":["fund"],"official_sources":[{"version_id":"1616f5f394b30424c1f630dbf217b882","title":"住房公积金贷款政策解读","original_date":"2026-09-18","repost_date":null,"channel":"fund","channel_label":"公积金","complete":true,"url":"https://www.sjzgjj.cn/zecjd/2491.jhtml","attachment_count":1}],"topic_ids":[],"topic_details":{},"summary":"一、问：办理住房公积金贷款住房套数认定范围是什么？ \n答：以缴存人家庭（家庭成员范围包括购房人、配偶以及\n未成年子女，下同）为单位计算，缴存人家庭购买长安区、桥\n西区、新华区、裕华区、高新区范围内住房的，其住房套数认\n定范围调整为拟购住房所在行政区。缴存人家庭申请贷款时，\n只核查拟购住房所在行政区住房，其他区域住房不计入住房套\n数。 \n例：小明缴存住房公积金，在桥西区、新华区各有一套自\n住住房，家庭名下在长安区没有住房。现小明申请购买长安区\n住房，在申请公积金贷款时，视为购买首套住房。 \n二、问：住房套数认定标准是什么？ \n答：（一）缴存人家庭符合下列情形之一，能提供相应证\n明材料的，可核减一套住房套数。同时符合多种情形的，仅核\n减一套，不叠加核减。1.多子女家庭的，提供子女户口本和出\n生医学证明；2.持有效石家庄市人才绿卡A卡、B卡的，提供石\n家庄市人才绿卡A卡或B卡；3.购买我市二星级及以上新建绿色\n建筑或被动式超低能耗住房的，以公积金贷款项目准入时房地\n产开发企业提供的材料为准，借款申请人无需提供。\n\n（二）缴存人家庭住房套数，按购房所在县（市、区）实\n际拥有套数核减后认定，核减后仍认定为两套及以上的，不予\n受理住房公积金贷款申请。 \n（三）缴存人家庭申请住房公积金贷款(包含商品房、二手\n房和“商转公”贷款)时，在全国范围内无未结清住房公积金贷\n款的，且经认定符合贷款条件的，执行首套房贷政策，不再受\n住房公积金贷款使用次数限制。 \n例：1.小王在我市桥西区拥有一套公积金贷款已结清的自\n住住房，现拟在桥西区再次购买自住住房，申请公积金贷款时，\n按首套住房政策执行。 \n2.小刘符合多子女家庭认定条件，在我市裕华区有两套公\n积金贷款均已结清的自住住房，现拟在裕华区再次购买自住住\n房，经中心认定核减一套住房后，申请公积金贷款时，按首套\n住房政策执行。 \n3.小张在我市裕华区有两套自住住房，现拟将其中一套正\n在偿还商业贷款的自住住房转为公积金贷款，申请“商转公”\n时，按首套住房政策执行。 \n三、问：申请主城区（长安区、桥西区、新华区、裕华区、\n高新区）住房公积金贷款，还需补充提供什么材料？ \n答：（一）主城区住房套数为零套、一套的，借款人无需\n额外提供住房证明材料。","summary_available":true,"library_status":"unmapped","library_status_label":"待关联事项","source_conflict":false,"nature_label":"政策解读","evidence_status_label":"政策解读","scope_level":"local","scope_label":"石家庄","record_kind":"reference","formal_policy_count":0,"parent_policy_id":"7779d67f573c5ff0612390625ab90357","reference_status":"linked","reference_status_label":"正式文件的配套解读","parent_title":"关于调整住房公积金贷款有关政策的通知","personal_key":"family:8e24f2740336f7b9145078eae3ae3192eff88bac87f0d5e10bf6178cd585ded8"},{"version_id":"1a7c16299a64ba19ac007afdb9349049","title":"住房公积金装修提取政策解读","scope":"石家庄","issuer":null,"doc_no":null,"nature":"explanation","complete":true,"original_date":"2026-09-18","repost_date":null,"effective_date":null,"source_url":"https://www.sjzgjj.cn/zecjd/2490.jhtml","collection_track":"delta","issued_date":null,"source_issuer":"石家庄住房公积金管理中心","date_eligible":true,"policy_id":"0079664d84ad542183332e43fadc1026","reference_cities":[],"channels":["fund"],"official_sources":[{"version_id":"1a7c16299a64ba19ac007afdb9349049","title":"住房公积金装修提取政策解读","original_date":"2026-09-18","repost_date":null,"channel":"fund","channel_label":"公积金","complete":true,"url":"https://www.sjzgjj.cn/zecjd/2490.jhtml","attachment_count":1}],"topic_ids":[],"topic_details":{},"summary":"一、哪些人可以申请办理装修提取住房公积金业务？ \n答：石家庄住房公积金缴存人本人及其配偶，可申请办理\n装修提取住房公积金业务。 \n二、房子需要满足哪些条件？ \n答：申请装修提取住房公积金的房产须为石家庄市行政区\n域内的自住住房，符合下列条件之一的，可申请办理： \n（一）取得不动产权证书或房屋所有权证满 10 年的自住住\n房； \n（二）2026 年 9 月20日（含）以后，取得不动产权证书的\n自住住房。 \n三、装修提取能提多少钱？ \n答：每个缴存人提取金额最高不超过 15 万元。 \n四、装修提取可以办理几次？ \n答：每个缴存人只可申请一次装修提取。 \n五、同一套房产允许几个人办理装修提取？ \n答：同一套住房在房产持有期间，最多允许两人办理装修\n提取。 \n六、房产取得时间以什么为准？ \n答：申请装修提取的自住住房，房产取得时间以证件登记\n\n时间为准。 \n七、换过不动产权证书，房产取得时间怎么认定？ \n答：因补发、变更、析产等原因换发不动产权证书的，房\n产取得时间以产权人首次取得该套住房的登记时间认定。 \n八、装修提取住房公积金有哪些办理渠道？ \n答：装修提取住房公积金设有线上、线下两种办理渠道。 \n九、装修提取住房公积金需要哪些材料？ \n答：（一）线下窗口办理 \n缴存人需提供不动产权证书或房屋所有权证、本人有效身\n份证件、Ⅰ类银行卡（现支持工商、农业、中国、建设、交通\n银行）申请办理；作为配偶提取的，另需提供产权人有效身份\n证件及婚姻关系证明材料。 \n（二）线上全程网办 \n能够通过信息联网核查提取条件的，可通过“手机公积金”\nAPP 全程网上办理。 \n十、装修提取住房公积金政策什么时候开始施行？ \n答：自 2026 年 9 月 20 日起施行。","summary_available":true,"librar _details":{"support_fund_loan_limit":{"version_id":"eb93276b3ab647ff76d145c5993b3bcc","scope":"石家庄","title":"关于调整住房公积金贷款有关政策的通知","original_date":"2026-09-18","summary":"1\n \n石家庄住房公积金管理中心 \n关于调整住房公积金贷款有关政策的通知 \n \n各缴存单位、缴存人： \n为更好发挥住房公积金住房保障作用，减轻缴存人住房消\n费压力，满足缴存人刚性及改善型住房需求，助力我市房地产\n市场平稳健康发展，结合我市实际，经石家庄住房公积金管理\n委员会审议通过，现就调整住房公积金贷款政策有关事项通知\n如下： \n一、调整住房公积金贷款最高额度 \n（一）缴存人家庭购买长安区、桥西区、新华区、裕华区、\n高新区住房，单方缴存最高贷款额度100万元，双方缴存最高贷\n款额度120万元； \n缴存人家庭购买经济技术开发区、鹿泉区、栾城区、藁城\n区及正定县住房，单方缴存最高贷款额度80万元，双方缴存最高\n贷款额度100万元； \n缴存人家庭购买晋州市、新乐市、井陉县、无极县、深泽\n县、行唐县、灵寿县、平山县、赵县、元氏县、高邑县、赞皇\n县、井陉矿区住房，单方缴存最高贷款额度60万元，双方缴存最\n高贷款额度80万元。 \n（二）缴存人家庭购买商品住房现房的，最高贷款额度在\n2\n现行政策基础上提高20万元。 \n二、阶段性优化住房套数认定范围 \n缴存人家庭购买长安区、桥西区、新华区、裕华区、高新\n区范围内自住住房的，其住房套数按拟购住房所在区认定。 \n三、阶段性优化住房套数认定标准 \n（一）住房套数认定标准按以下规定执行： \n1.缴存人家庭存在以下情形之一的，可核减一套住房套数： \n（1）多子女家庭的； \n（2）持有效石家庄市人才绿卡A卡、B卡的； \n（3）购买二星级及以上新建绿色建筑或被动式超低能耗住\n房的。 \n同时符合多种情形的，仅核减一套，不叠加核减。 \n2.执行核减政策后，缴存人家庭在拟购住房所在县（市、\n区）住房套数仍认定为两套及以上的，不予受理住房公积金贷\n款申请。 \n（二）缴存人家庭全国范围内无未结清住房公积金贷款，\n且按照上述规定准予贷款的，执行首套房贷款政策。 \n四、规范非城镇住宅用地住房信贷管理 \n（一）缴存人家庭自有宅基地自建住房，不纳入住房套数\n统计。 \n（二）缴存人家庭购买非住宅建设用地上住房申请公积金\n贷款的，贷款额度不超过房屋总价的50%。","scope_label":"石家庄","policy_id":"7779d67f573c5ff0612390625ab90357","personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"},"support_fund_eligibility":{"version_id":"eb93276b3ab647ff76d145c5993b3bcc","scope":"石家庄","title":"关于调整住房公积金贷款有关政策的通知","original_date":"2026-09-18","summary":"2\n现行政策基础上提高20万元。 \n二、阶段性优化住房套数认定范围 \n缴存人家庭购买长安区、桥西区、新华区、裕华区、高新\n区范围内自住住房的，其住房套数按拟购住房所在区认定。 \n三、阶段性优化住房套数认定标准 \n（一）住房套数认定标准按以下规定执行： \n1.缴存人家庭存在以下情形之一的，可核减一套住房套数： \n（1）多子女家庭的； \n（2）持有效石家庄市人才绿卡A卡、B卡的； \n（3）购买二星级及以上新建绿色建筑或被动式超低能耗住\n房的。 \n同时符合多种情形的，仅核减一套，不叠加核减。 \n2.执行核减政策后，缴存人家庭在拟购住房所在县（市、\n区）住房套数仍认定为两套及以上的，不予受理住房公积金贷\n款申请。 \n（二）缴存人家庭全国范围内无未结清住房公积金贷款，\n且按照上述规定准予贷款的，执行首套房贷款政策。 \n四、规范非城镇住宅用地住房信贷管理 \n（一）缴存人家庭自有宅基地自建住房，不纳入住房套数\n统计。 \n（二）缴存人家庭购买非住宅建设用地上住房申请公积金\n贷款的，贷款额度不超过房屋总价的50%。","scope_label":"石家庄","policy_id":"7779d67f573c5ff0612390625ab90357","personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"}},"record_kind":"policy","formal_policy_count":1,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"local","scope_label":"石家庄","personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"},{"version_id":"825d2f6572d77477a9ae4d5507a04417","title":"关于开展装修提取住房公积金业务的通知","scope":"石家庄","issuer":null,"doc_no":null,"nature":"formal","complete":true,"original_date":"2026-09-18","repost_date":null,"effective_date":null,"source_url":"https://www.sjzgjj.cn/tzgg/2488.jhtml","reference_cities":[],"collection_track":"delta","issued_date":null,"source_issuer":"石家庄住房公积金管理中心","channels":["fund"],"policy_id":"563dc1cfefbba1c8c137b33c353eb8cc","source_conflict":false,"official_sources":[{"version_id":"825d2f6572d77477a9ae4d5507a04417","title":"关于开展装修提取住房公积金业务的通知","original_date":"2026-09-18","repost_date":null,"channel":"fund","channel_label":"公积金","complete":true,"url":"https://www.sjzgjj.cn/tzgg/2488.jhtml","attachment_count":1}],"topic_ids":["support_renovation_withdrawal"],"topic_details":{"support_renovation_withdrawal":{"version_id":"825d2f6572d77477a9ae4d5507a04417","scope":"石家庄","title":"关于开展装修提取住房公积金业务的通知","original_date":"2026-09-18","summary":"石家庄住房公积金管理中心关于开展装修提取住房公积金业务的通知.pdf\n1\n \n \n石家庄住房公积金管理中心 \n关于开展装修提取住房公积金业务的通知 \n \n各缴存单位、缴存人： \n为进一步满足缴存人多样化住房消费需求，根据《住房公\n积金管理条例》有关规定，结合我市实际，经石家庄住房公积\n金管理委员会审议通过，现就开展支持自住住房装修提取住房\n公积金业务有关事项通知如下： \n一、适用范围 \n缴存人本人及其配偶对自住住房进行装修，符合下列条件\n之一的，可申请装修提取住房公积金： \n（一）在本市行政区域内且取得不动产权证书或房屋所有\n权证满 10 年的自住住房； \n（二）2026 年 9 月20日（含）以后，在本市行政区域内取\n得不动产权证书的自住住房。 \n二、提取额度 \n每个缴存人只可申请一次装修提取，提取金额最高不超过\n15 万元。 \n三、注意事项 \n（一）同一套住房在房产持有期间最多允许两人办理装修\n提取。 \n（二）申请装修提取的自住住房，房产取得时间以证件登\n记时间为准。因补发、变更、析产等原因换发不动产权证书的，","scope_label":"石家庄","policy_id":"563dc1cfefbba1c8c137b33c353eb8cc","personal_key":"family:081ddaf9466f63aee39cd4e2e5f731643ae99e5240515b5234f712143d11cda7"}},"record_kind":"policy","formal_policy_count":1,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"local","scope_label":"石家庄","personal_key":"family:081ddaf9466f63aee39cd4e2e5f731643ae99e5240515b5234f712143d11cda7"},{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","scope":"国家","issuer":"住房和城乡建设部、自然资源部、金融监管总局","doc_no":"建房规〔2026〕3号","nature":"formal","complete":true,"original_date":"2026-08-28","repost_date":"2026-09-08","effective_date":"2026-08-28","source_url":"https://www.hunan.gov.cn/zqt/zcsd/202609/t20260907_34057926.html","reference_cities":["北京","天津","石家庄","三亚","陵水"],"collection_track":"delta","issued_date":"2026-08-28","source_issuer":"住房和城乡建设部、自然资源部、金融监管总局","channels":["national"],"policy_id":"6ff71443c8a24f78f7b64d4b840c194a","source_conflict":false,"official_sources":[{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","repost_date":"2026-09-08","channel":"national","channel_label":"国家部委","complete":true,"url":"https://www.hunan.gov.cn/zqt/zcsd/202609/t20260907_34057926.html","attachment_count":0}],"topic_ids":["implementation_rules","sheet_row_10","sheet_row_11","sheet_row_17","sheet_row_21","sheet_row_22","sheet_row_23","sheet_row_34","sheet_row_45"],"topic_details":{"implementation_rules":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"为贯彻落实党中央、国务院关于加快构建房地产发展新模式的决策部署,坚持稳中求进、先立后破,稳步推进商品住房销售制度改革,现就有关事项通知如下。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_10":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)优化存量项目预售管理。本通知施行之日前已取得建设工程规划许可证的商品住房项目,实行预售的,预售条件、预售资金监管等按原有政策规定执行。应合理确定监管额度,优化预售资金使用,严格预售资金监管,保障预售资金安全。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_11":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)优化存量项目预售管理。本通知施行之日前已取得建设工程规划许可证的商品住房项目,实行预售的,预售条件、预售资金监管等按原有政策规定执行。应合理确定监管额度,优化预售资金使用,严格预售资金监管,保障预售资金安全。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_17":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"各地要规范商品住房预售条件,加强预售资金监管,保障预售资金安全,有效防范商品住房交付风险,维护购房人合法权益。\n(一)规范预售条件。商品住房项目实行预售的,单体建筑应完成主体结构封顶,具体条件由各地根据实际情况确定。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_21":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(一)推进商品住房现房销售。本通知施行之日起,新出让土地的商品住房项目和已出让土地未取得建设工程规划许可证的商品住房项目,优先选择现房销售;已取得建设工程规划许可证的商品住房项目,鼓励实行现房销售。\n(一)优化土地供应管理。市县要优化国土空间规划和土地利用方式,按照住房发展规划和年度计划,合理确定房地产用地供应规模。统筹规划、合理布局商品住宅用地,优化土地出让方案,可带规划方案出让。房地产开发企业须用自有资金购地,可按国家规定分期缴纳土地出让价款,具体缴纳比例和时限由市县人民政府确定。对于实行现房销售的项目,在土地出让公告中向社会公开现房销售相关信息。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_22":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(一)推进商品住房现房销售。本通知施行之日起,新出让土地的商品住房项目和已出让土地未取得建设工程规划许可证的商品住房项目,优先选择现房销售;已取得建设工程规划许可证的商品住房项目,鼓励实行现房销售。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_23":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)推行现房销售定金制。实行现房销售的商品住房项目,在取得建筑工程施工许可证后,房地产开发企业可与购房人签订购房定金合同,依法收取少量定金。购房定金合同应约定定金金额、商品住房售价、交付时间及不能按期履约的责任等,保护双方合法权益。市县住房和城乡建设部门履行定金监管职责,住房资金监管机构承担定金监管工作,在项目的主办银行开立定金监管账户。房屋具备交付条件后,解除定金监管。房地产开发企业违约不能按期交房的,购房人有权按照合同约定提出解除定金合同,房地产开发企业依法返还定金,承担违约责任。各地要结合实际制定购房定金合同示范文本。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_34":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"各地要规范商品住房预售条件,加强预售资金监管,保障预售资金安全,有效防范商品住房交付风险,维护购房人合法权益。\n(二)加强预售资金监管。市县住房和城乡建设部门履行预售资金监管职责,由住房资金监管机构承担具体监管工作。住房资金监管机构应与房地产开发企业签订资金监管协议,并在项目的主办银行开立资金监管账户。购房人支付的首付款、个人住房贷款等购房资金应全部存入资金监管账户。商品住房项目竣工验收、水电气热等配套设施具备交付条件后,解除资金监管。房地产开发企业违约不能按期交房的,购房人有权按照合同约定提出解除购房合同,房地产开发企业须按照合同约定退还购房资金并承担违约责任。房地产开发企业应与购房人在购房合同中约定购房资金存入资金监管账户的相关权利责任。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_45":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(二)加大融资支持力度。房地产项目实行主办银行制,房地产项目开发公司和主办银行双向选择,一个项目确定一家主办银行,主办银行单独或牵头组建银团提供开发贷款等融资服务。房地产项目开发公司以土地使用权抵押申请开发贷款的,应以分户土地使用权集合设定抵押,相关办法另行制定。支持房地产项目开发公司通过股权、债券等多种方式开展融资。对实行现房销售和预售的项目,按照市场化原则满足项目合理融资需求,实现开发贷款发放与项目建设周期相匹配。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"}},"record_kind":"policy","formal_policy_count":1,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"national","scope_label":"国家基准 / 参考","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},{"version_id":"3c6f215d75206983efc14407d24560ff","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","scope":"国家","issuer":"中国人民银行、国家金融监督管理总局","doc_no":"银发〔2026〕171号","nature":"formal","complete":true,"original_date":"2026-08-28","repost_date":"2026-09-08","effective_date":"2026-08-28","source_url":"https://hunan.gov.cn/zqt/zcsd/202609/t20260907_34058152.html","reference_cities":["北京","天津","石家庄","三亚","陵水"],"collection_track":"delta","issued_date":"2026-08-28","source_issuer":"中国人民银行、国家金融监督管理总局","channels":["national"],"policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","source_conflict":false,"official_sources":[{"version_id":"3c6f215d75206983efc14407d24560ff","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","repost_date":"2026-09-08","channel":"national","channel_label":"国家部委","complete":true,"url":"https://hunan.gov.cn/zqt/zcsd/202609/t20260907_34058152.html","attachment_count":0}],"topic_ids":["sheet_row_18","sheet_row_19","sheet_row_23","sheet_row_34","sheet_row_45"],"topic_details":{"sheet_row_18":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"第二十二条 所购新建住房实行现房销售的,个人住房贷款应在销售备案后发放;实行预售的,应严格在项目竣工备案后发放。\n个人住房贷款应通过受托支付方式发放。对实行现房销售的,受托支付至项目公司在主办银行开立的资金账户;对实行预售的,受托支付至项目预售资金监管账户。所购住房为再交易住房的,受托支付至贷款合同约定的借款人交易对象账户。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_19":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"第二十二条 所购新建住房实行现房销售的,个人住房贷款应在销售备案后发放;实行预售的,应严格在项目竣工备案后发放。\n个人住房贷款应通过受托支付方式发放。对实行现房销售的,受托支付至项目公司在主办银行开立的资金账户;对实行预售的,受托支付至项目预售资金监管账户。所购住房为再交易住房的,受托支付至贷款合同约定的借款人交易对象账户。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_23":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"项目公司应在主办银行开立资金账户。项目存续期间,除按规定要求监管的预售资金、定金等外,房地产开发贷款、项目自有资金、现房销售资金等与项目相关的全部资金均应纳入在主办银行开立的资金账户管理。主办银行和资金账户在房地产开发贷款结清前原则上不得变更。\n项目预售资金监管账户和定金账户应按规定在主办银行开立。项目公司对外负债、投资等影响金融债务安全的重大事项,应事先告知主办银行。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_34":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"项目公司应在主办银行开立资金账户。项目存续期间,除按规定要求监管的预售资金、定金等外,房地产开发贷款、项目自有资金、现房销售资金等与项目相关的全部资金均应纳入在主办银行开立的资金账户管理。主办银行和资金账户在房地产开发贷款结清前原则上不得变更。\n项目预售资金监管账户和定金账户应按规定在主办银行开立。项目公司对外负债、投资等影响金融债务安全的重大事项,应事先告知主办银行。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_45":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"第十二条 房地产开发贷款实行主办银行制,单个房地产项目对应一家银行作为主办银行(单家贷款行或银团贷款牵头行),对项目资金进行封闭管理。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"}},"record_kind":"policy","formal_policy_count":1,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"national","scope_label":"国家基准 / 参考","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},{"version_id":"0b8562fef 26〕3号）有关要求，加快构建房地产发展新模式，稳步推进商品住房销售制度改革，结合本市实际，提出如下实施意见 。\n\n（一）新取得土地项目。 2026年8月28日后 新发布国有 建设用地 使用权出让公告的商品住房项目， 申请 预售 的 ，单体建筑 应 完成主体结构封顶 （楼栋顶板及楼顶构筑物、配套设施完成混凝土浇筑）， 项目 建设单位、勘察、设计、施工、监理 等单位 应出具 签字 盖章 的《主体结构分部工程验收记录》 。项目 预售资金全额 、全过程监管 ，项目 联合验收后 ， 方可 解除资金监管。 具体预售资金监管办法另行印发。","summary_available":true,"library_status":"mapped","library_status_label":"已关联事项","source_conflict":false,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"local","scope_label":"北京","record_kind":"policy","formal_policy_count":1,"parent_policy_id":null,"personal_key":"family:1751a146d5d3518f2aac2297df4afb2c4816926a738acc4cdf81542b9f60a0c3"},{"version_id":"eb93276b3ab647ff76d145c5993b3bcc","title":"关于调整住房公积金贷款有关政策的通知","scope":"石家庄","issuer":null,"doc_no":null,"nature":"formal","complete":true,"original_date":"2026-09-18","repost_date":null,"effective_date":"2026-09-20","source_url":"https://www.sjzgjj.cn/tzgg/2489.jhtml","collection_track":"delta","issued_date":null,"source_issuer":"石家庄住房公积金管理中心","date_eligible":true,"policy_id":"7779d67f573c5ff0612390625ab90357","reference_cities":[],"channels":["fund"],"official_sources":[{"version_id":"eb93276b3ab647ff76d145c5993b3bcc","title":"关于调整住房公积金贷款有关政策的通知","original_date":"2026-09-18","repost_date":null,"channel":"fund","channel_label":"公积金","complete":true,"url":"https://www.sjzgjj.cn/tzgg/2489.jhtml","attachment_count":1}],"topic_ids":["support_fund_loan_limit","support_fund_eligibility"],"topic_details":{"support_fund_loan_limit":{"version_id":"eb93276b3ab647ff76d145c5993b3bcc","scope":"石家庄","title":"关于调整住房公积金贷款有关政策的通知","original_date":"2026-09-18","summary":"1\n \n石家庄住房公积金管理中心 \n关于调整住房公积金贷款有关政策的通知 \n \n各缴存单位、缴存人： \n为更好发挥住房公积金住房保障作用，减轻缴存人住房消\n费压力，满足缴存人刚性及改善型住房需求，助力我市房地产\n市场平稳健康发展，结合我市实际，经石家庄住房公积金管理\n委员会审议通过，现就调整住房公积金贷款政策有关事项通知\n如下： \n一、调整住房公积金贷款最高额度 \n（一）缴存人家庭购买长安区、桥西区、新华区、裕华区、\n高新区住房，单方缴存最高贷款额度100万元，双方缴存最高贷\n款额度120万元； \n缴存人家庭购买经济技术开发区、鹿泉区、栾城区、藁城\n区及正定县住房，单方缴存最高贷款额度80万元，双方缴存最高\n贷款额度100万元； \n缴存人家庭购买晋州市、新乐市、井陉县、无极县、深泽\n县、行唐县、灵寿县、平山县、赵县、元氏县、高邑县、赞皇\n县、井陉矿区住房，单方缴存最高贷款额度60万元，双方缴存最\n高贷款额度80万元。 \n（二）缴存人家庭购买商品住房现房的，最高贷款额度在\n2\n现行政策基础上提高20万元。 \n二、阶段性优化住房套数认定范围 \n缴存人家庭购买长安区、桥西区、新华区、裕华区、高新\n区范围内自住住房的，其住房套数按拟购住房所在区认定。 \n三、阶段性优化住房套数认定标准 \n（一）住房套数认定标准按以下规定执行： \n1.缴存人家庭存在以下情形之一的，可核减一套住房套数： \n（1）多子女家庭的； \n（2）持有效石家庄市人才绿卡A卡、B卡的； \n（3）购买二星级及以上新建绿色建筑或被动式超低能耗住\n房的。 \n同时符合多种情形的，仅核减一套，不叠加核减。 \n2.执行核减政策后，缴存人家庭在拟购住房所在县（市、\n区）住房套数仍认定为两套及以上的，不予受理住房公积金贷\n款申请。 \n（二）缴存人家庭全国范围内无未结清住房公积金贷款，\n且按照上述规定准予贷款的，执行首套房贷款政策。 \n四、规范非城镇住宅用地住房信贷管理 \n（一）缴存人家庭自有宅基地自建住房，不纳入住房套数\n统计。 \n（二）缴存人家庭购买非住宅建设用地上住房申请公积金\n贷款的，贷款额度不超过房屋总价的50%。","scope_label":"石家庄","policy_id":"7779d67f573c5ff0612390625ab90357","personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"},"support_fund_eligibility":{"version_id":"eb93276b3ab647ff76d145c5993b3bcc","scope":"石家庄","title":"关于调整住房公积金贷款有关政策的通知","original_date":"2026-09-18","summary":"2\n现行政策基础上提高20万元。 \n二、阶段性优化住房套数认定范围 \n缴存人家庭购买长安区、桥西区、新华区、裕华区、高新\n区范围内自住住房的，其住房套数按拟购住房所在区认定。 \n三、阶段性优化住房套数认定标准 \n（一）住房套数认定标准按以下规定执行： \n1.缴存人家庭存在以下情形之一的，可核减一套住房套数： \n（1）多子女家庭的； \n（2）持有效石家庄市人才绿卡A卡、B卡的； \n（3）购买二星级及以上新建绿色建筑或被动式超低能耗住\n房的。 \n同时符合多种情形的，仅核减一套，不叠加核减。 \n2.执行核减政策后，缴存人家庭在拟购住房所在县（市、\n区）住房套数仍认定为两套及以上的，不予受理住房公积金贷\n款申请。 \n（二）缴存人家庭全国范围内无未结清住房公积金贷款，\n且按照上述规定准予贷款的，执行首套房贷款政策。 \n四、规范非城镇住宅用地住房信贷管理 \n（一）缴存人家庭自有宅基地自建住房，不纳入住房套数\n统计。 \n（二）缴存人家庭购买非住宅建设用地上住房申请公积金\n贷款的，贷款额度不超过房屋总价的50%。","scope_label":"石家庄","policy_id":"7779d67f573c5ff0612390625ab90357","personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"}},"summary":"一、调整住房公积金贷款最高额度 \n（一）缴存人家庭购买长安区、桥西区、新华区、裕华区、\n高新区住房，单方缴存最高贷款额度100万元，双方缴存最高贷\n款额度120万元； \n缴存人家庭购买经济技术开发区、鹿泉区、栾城区、藁城\n区及正定县住房，单方缴存最高贷款额度80万元，双方缴存最高\n贷款额度100万元； \n缴存人家庭购买晋州市、新乐市、井陉县、无极县、深泽\n县、行唐县、灵寿县、平山县、赵县、元氏县、高邑县、赞皇\n县、井陉矿区住房，单方缴存最高贷款额度60万元，双方缴存最\n高贷款额度80万元。 \n（二）缴存人家庭购买商品住房现房的，最高贷款额度在\n\n现行政策基础上提高20万元。 \n二、阶段性优化住房套数认定范围 \n缴存人家庭购买长安区、桥西区、新华区、裕华区、高新\n区范围内自住住房的，其住房套数按拟购住房所在区认定。 \n三、阶段性优化住房套数认定标准 \n（一）住房套数认定标准按以下规定执行： \n1.缴存人家庭存在以下情形之一的，可核减一套住房套数： \n（1）多子女家庭的； \n（2）持有效石家庄市人才绿卡A卡、B卡的； \n（3）购买二星级及以上新建绿色建筑或被动式超低能耗住\n房的。 \n同时符合多种情形的，仅核减一套，不叠加核减。 \n2.执行核减政策后，缴存人家庭在拟购住房所在县（市、\n区）住房套数仍认定为两套及以上的，不予受理住房公积金贷\n款申请。 \n（二）缴存人家庭全国范围内无未结清住房公积金贷款，\n且按照上述规定准予贷款的，执行首套房贷款政策。 \n四、规范非城镇住宅用地住房信贷管理 \n（一）缴存人家庭自有宅基地自建住房，不纳入住房套数\n统计。 \n（二）缴存人家庭购买非住宅建设用地上住房申请公积金\n贷款的，贷款额度不超过房屋总价的50%。","summary_available":true,"library_status":"mapped","library_status_label":"已关联事项","source_conflict":false,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"local","scope_label":"石家庄","record_kind":"policy","formal_policy_count":1,"parent_policy_id":null,"personal_key":"family:3cff9017c1bcf162e5248d93957e144574f3b0b8df36dcb55ee96d7c025cd315"},{"version_id":"825d2f6572d77477a9ae4d5507a04417","title":"关于开展装修提取住房公积金业务的通知","scope":"石家庄","issuer":null,"doc_no":null,"nature":"formal","complete":true,"original_date":"2026-09-18","repost_date":null,"effective_date":null,"source_url":"https://www.sjzgjj.cn/tzgg/2488.jhtml","collection_track":"delta","issued_date":null,"source_issuer":"石家庄住房公积金管理中心","date_eligible":true,"policy_id":"563dc1cfefbba1c8c137b33c353eb8cc","reference_cities":[],"channels":["fund"],"official_sources":[{"version_id":"825d2f6572d77477a9ae4d5507a04417","title":"关于开展装修提取住房公积金业务的通知","original_date":"2026-09-18","repost_date":null,"channel":"fund","channel_label":"公积金","complete":true,"url":"https://www.sjzgjj.cn/tzgg/2488.jhtml","attachment_count":1}],"topic_ids":["support_renovation_withdrawal"],"topic_details":{"support_renovation_withdrawal":{"version_id":"825d2f6572d77477a9ae4d5507a04417","scope":"石家庄","title":"关于开展装修提取住房公积金业务的通知","original_date":"2026-09-18","summary":"石家庄住房公积金管理中心关于开展装修提取住房公积金业务的通知.pdf\n1\n \n \n石家庄住房公积金管理中心 \n关于开展装修提取住房公积金业务的通知 \n \n各缴存单位、缴存人： \n为进一步满足缴存人多样化住房消费需求，根据《住房公\n积金管理条例》有关规定，结合我市实际，经石家庄住房公积\n金管理委员会审议通过，现就开展支持自住住房装修提取住房\n公积金业务有关事项通知如下： \n一、适用范围 \n缴存人本人及其配偶对自住住房进行装修，符合下列条件\n之一的，可申请装修提取住房公积金： \n（一）在本市行政区域内且取得不动产权证书或房屋所有\n权证满 10 年的自住住房； \n（二）2026 年 9 月20日（含）以后，在本市行政区域内取\n得不动产权证书的自住住房。 \n二、提取额度 \n每个缴存人只可申请一次装修提取，提取金额最高不超过\n15 万元。 \n三、注意事项 \n（一）同一套住房在房产持有期间最多允许两人办理装修\n提取。 \n（二）申请装修提取的自住住房，房产取得时间以证件登\n记时间为准。因补发、变更、析产等原因换发不动产权证书的，","scope_label":"石家庄","policy_id":"563dc1cfefbba1c8c137b33c353eb8cc","personal_key":"family:081ddaf9466f63aee39cd4e2e5f731643ae99e5240515b5234f712143d11cda7"}},"summary":"一、适用范围 \n缴存人本人及其配偶对自住住房进行装修，符合下列条件\n之一的，可申请装修提取住房公积金： \n（一）在本市行政区域内且取得不动产权证书或房屋所有\n权证满 10 年的自住住房； \n（二）2026 年 9 月20日（含）以后，在本市行政区域内取\n得不动产权证书的自住住房。 \n二、提取额度 \n每个缴存人只可申请一次装修提取，提取金额最高不超过\n15 万元。 \n三、注意事项 \n（一）同一套住房在房产持有期间最多允许两人办理装修\n提取。 \n（二）申请装修提取的自住住房，房产取得时间以证件登\n记时间为准。因补发、变更、析产等原因换发不动产权证书的，\n\n房产取得时间以产权人首次取得该套住房的登记时间认定。 \n四、办理方式 \n（一）线下窗口办理 \n缴存人需提供不动产权证书或房屋所有权证、本人有效身\n份证件、Ⅰ类银行卡（现支持工商、农业、中国、建设、交通\n银行）申请办理；作为配偶提取的，另需提供产权人有效身份\n证件及婚姻关系证明材料。 \n（二）线上全程网办 \n能够通过信息联网核查提取条件的，可通过“手机公积金”\nAPP 全程网上办理。 \n五、施行日期 \n本通知自 2026 年 9 月 20 日起施行，此前有关规定与本通\n知不一致的，以本通知为准。","summary_available":true,"library_status":"mapped","library_status_label":"已关联事项","source_conflict":false,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"local","scope_label":"石家庄","record_kind":"policy","formal_policy_count":1,"parent_policy_id":null,"personal_key":"family:081ddaf9466f63aee39cd4e2e5f731643ae99e5240515b5234f712143d11cda7"},{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","scope":"国家","issuer":"住房和城乡建设部、自然资源部、金融监管总局","doc_no":"建房规〔2026〕3号","nature":"formal","complete":true,"original_date":"2026-08-28","repost_date":"2026-09-08","effective_date":"2026-08-28","source_url":"https://www.hunan.gov.cn/zqt/zcsd/202609/t20260907_34057926.html","collection_track":"delta","issued_date":"2026-08-28","source_issuer":"住房和城乡建设部、自然资源部、金融监管总局","date_eligible":true,"policy_id":"6ff71443c8a24f78f7b64d4b840c194a","reference_cities":["北京","天津","石家庄","三亚","陵水"],"channels":["national"],"official_sources":[{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","repost_date":"2026-09-08","channel":"national","channel_label":"国家部委","complete":true,"url":"https://www.hunan.gov.cn/zqt/zcsd/202609/t20260907_34057926.html","attachment_count":0}],"topic_ids":["implementation_rules","sheet_row_10","sheet_row_11","sheet_row_17","sheet_row_21","sheet_row_22","sheet_row_23","sheet_row_34","sheet_row_45"],"topic_details":{"implementation_rules":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"为贯彻落实党中央、国务院关于加快构建房地产发展新模式的决策部署,坚持稳中求进、先立后破,稳步推进商品住房销售制度改革,现就有关事项通知如下。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_10":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)优化存量项目预售管理。本通知施行之日前已取得建设工程规划许可证的商品住房项目,实行预售的,预售条件、预售资金监管等按原有政策规定执行。应合理确定监管额度,优化预售资金使用,严格预售资金监管,保障预售资金安全。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_11":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)优化存量项目预售管理。本通知施行之日前已取得建设工程规划许可证的商品住房项目,实行预售的,预售条件、预售资金监管等按原有政策规定执行。应合理确定监管额度,优化预售资金使用,严格预售资金监管,保障预售资金安全。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_17":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"各地要规范商品住房预售条件,加强预售资金监管,保障预售资金安全,有效防范商品住房交付风险,维护购房人合法权益。\n(一)规范预售条件。商品住房项目实行预售的,单体建筑应完成主体结构封顶,具体条件由各地根据实际情况确定。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_21":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(一)推进商品住房现房销售。本通知施行之日起,新出让土地的商品住房项目和已出让土地未取得建设工程规划许可证的商品住房项目,优先选择现房销售;已取得建设工程规划许可证的商品住房项目,鼓励实行现房销售。\n(一)优化土地供应管理。市县要优化国土空间规划和土地利用方式,按照住房发展规划和年度计划,合理确定房地产用地供应规模。统筹规划、合理布局商品住宅用地,优化土地出让方案,可带规划方案出让。房地产开发企业须用自有资金购地,可按国家规定分期缴纳土地出让价款,具体缴纳比例和时限由市县人民政府确定。对于实行现房销售的项目,在土地出让公告中向社会公开现房销售相关信息。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_22":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(一)推进商品住房现房销售。本通知施行之日起,新出让土地的商品住房项目和已出让土地未取得建设工程规划许可证的商品住房项目,优先选择现房销售;已取得建设工程规划许可证的商品住房项目,鼓励实行现房销售。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_23":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(三)推行现房销售定金制。实行现房销售的商品住房项目,在取得建筑工程施工许可证后,房地产开发企业可与购房人签订购房定金合同,依法收取少量定金。购房定金合同应约定定金金额、商品住房售价、交付时间及不能按期履约的责任等,保护双方合法权益。市县住房和城乡建设部门履行定金监管职责,住房资金监管机构承担定金监管工作,在项目的主办银行开立定金监管账户。房屋具备交付条件后,解除定金监管。房地产开发企业违约不能按期交房的,购房人有权按照合同约定提出解除定金合同,房地产开发企业依法返还定金,承担违约责任。各地要结合实际制定购房定金合同示范文本。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_34":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"各地要规范商品住房预售条件,加强预售资金监管,保障预售资金安全,有效防范商品住房交付风险,维护购房人合法权益。\n(二)加强预售资金监管。市县住房和城乡建设部门履行预售资金监管职责,由住房资金监管机构承担具体监管工作。住房资金监管机构应与房地产开发企业签订资金监管协议,并在项目的主办银行开立资金监管账户。购房人支付的首付款、个人住房贷款等购房资金应全部存入资金监管账户。商品住房项目竣工验收、水电气热等配套设施具备交付条件后,解除资金监管。房地产开发企业违约不能按期交房的,购房人有权按照合同约定提出解除购房合同,房地产开发企业须按照合同约定退还购房资金并承担违约责任。房地产开发企业应与购房人在购房合同中约定购房资金存入资金监管账户的相关权利责任。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},"sheet_row_45":{"version_id":"de662fe0ee53ba0cd4de4eb3521f23c1","scope":"国家","title":"住房和城乡建设部 自然资源部 金融监管总局关于完善商品住房销售制度的通知","original_date":"2026-08-28","summary":"(二)加大融资支持力度。房地产项目实行主办银行制,房地产项目开发公司和主办银行双向选择,一个项目确定一家主办银行,主办银行单独或牵头组建银团提供开发贷款等融资服务。房地产项目开发公司以土地使用权抵押申请开发贷款的,应以分户土地使用权集合设定抵押,相关办法另行制定。支持房地产项目开发公司通过股权、债券等多种方式开展融资。对实行现房销售和预售的项目,按照市场化原则满足项目合理融资需求,实现开发贷款发放与项目建设周期相匹配。","scope_label":"国家基准 / 参考","policy_id":"6ff71443c8a24f78f7b64d4b840c194a","personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"}},"summary":"为贯彻落实党中央、国务院关于加快构建房地产发展新模式的决策部署,坚持稳中求进、先立后破,稳步推进商品住房销售制度改革,现就有关事项通知如下。\n\n各地要规范商品住房预售条件,加强预售资金监管,保障预售资金安全,有效防范商品住房交付风险,维护购房人合法权益。","summary_available":true,"library_status":"mapped","library_status_label":"已关联事项","source_conflict":false,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"national","scope_label":"国家基准 / 参考","record_kind":"policy","formal_policy_count":1,"parent_policy_id":null,"personal_key":"family:53a71aee2246258d9078e56fd84eb5c0ead2672b0503ffd49dec87a1caea4fe3"},{"version_id":"3c6f215d75206983efc14407d24560ff","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","scope":"国家","issuer":"中国人民银行、国家金融监督管理总局","doc_no":"银发〔2026〕171号","nature":"formal","complete":true,"original_date":"2026-08-28","repost_date":"2026-09-08","effective_date":"2026-08-28","source_url":"https://hunan.gov.cn/zqt/zcsd/202609/t20260907_34058152.html","collection_track":"delta","issued_date":"2026-08-28","source_issuer":"中国人民银行、国家金融监督管理总局","date_eligible":true,"policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","reference_cities":["北京","天津","石家庄","三亚","陵水"],"channels":["national"],"official_sources":[{"version_id":"3c6f215d75206983efc14407d24560ff","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","repost_date":"2026-09-08","channel":"national","channel_label":"国家部委","complete":true,"url":"https://hunan.gov.cn/zqt/zcsd/202609/t20260907_34058152.html","attachment_count":0}],"topic_ids":["sheet_row_18","sheet_row_19","sheet_row_23","sheet_row_34","sheet_row_45"],"topic_details":{"sheet_row_18":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"第二十二条 所购新建住房实行现房销售的,个人住房贷款应在销售备案后发放;实行预售的,应严格在项目竣工备案后发放。\n个人住房贷款应通过受托支付方式发放。对实行现房销售的,受托支付至项目公司在主办银行开立的资金账户;对实行预售的,受托支付至项目预售资金监管账户。所购住房为再交易住房的,受托支付至贷款合同约定的借款人交易对象账户。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_19":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"第二十二条 所购新建住房实行现房销售的,个人住房贷款应在销售备案后发放;实行预售的,应严格在项目竣工备案后发放。\n个人住房贷款应通过受托支付方式发放。对实行现房销售的,受托支付至项目公司在主办银行开立的资金账户;对实行预售的,受托支付至项目预售资金监管账户。所购住房为再交易住房的,受托支付至贷款合同约定的借款人交易对象账户。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_23":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"项目公司应在主办银行开立资金账户。项目存续期间,除按规定要求监管的预售资金、定金等外,房地产开发贷款、项目自有资金、现房销售资金等与项目相关的全部资金均应纳入在主办银行开立的资金账户管理。主办银行和资金账户在房地产开发贷款结清前原则上不得变更。\n项目预售资金监管账户和定金账户应按规定在主办银行开立。项目公司对外负债、投资等影响金融债务安全的重大事项,应事先告知主办银行。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_34":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"项目公司应在主办银行开立资金账户。项目存续期间,除按规定要求监管的预售资金、定金等外,房地产开发贷款、项目自有资金、现房销售资金等与项目相关的全部资金均应纳入在主办银行开立的资金账户管理。主办银行和资金账户在房地产开发贷款结清前原则上不得变更。\n项目预售资金监管账户和定金账户应按规定在主办银行开立。项目公司对外负债、投资等影响金融债务安全的重大事项,应事先告知主办银行。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},"sheet_row_45":{"version_id":"3c6f215d75206983efc14407d24560ff","scope":"国家","title":"中国人民银行 国家金融监督管理总局印发《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》的通知（银发〔2026〕171号）","original_date":"2026-08-28","summary":"第十二条 房地产开发贷款实行主办银行制,单个房地产项目对应一家银行作为主办银行(单家贷款行或银团贷款牵头行),对项目资金进行封闭管理。","scope_label":"国家基准 / 参考","policy_id":"56f26fd74ecaf2c8f6f166d3238fc2bf","personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"}},"summary":"为深入贯彻落实党中央、国务院关于构建房地产发展新模式的决策部署,完善房地产信贷管理,维护购房人合法权益,满足行业合理融资需求,促进房地产市场稳健运行,现将《关于改革完善房地产信贷管理 推动加快构建房地产发展新模式的意见》印发给你们,请遵照执行。\n\n第一条 为完善房地产信贷管理,维护购房人合法权益,满足行业合理融资需求,促进房地产市场稳健运行,加快构建房地产发展新模式,推动房地产高质量发展,根据《中华人民共和国中国人民银行法》《中华人民共和国银行业监督管理法》《中华人民共和国商业银行法》等法律法规,制定本意见。","summary_available":true,"library_status":"mapped","library_status_label":"已关联事项","source_conflict":false,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"national","scope_label":"国家基准 / 参考","record_kind":"policy","formal_policy_count":1,"parent_policy_id":null,"personal_key":"family:1177d3e8e7767831c4805c03ded9d15ecf8a36afa2cd12a3828e2814daaddd34"},{"version_id":"0b8562fefaf1b18a1d726671975d980e","title":"国务院关于修改《住房公积金管理条例》的决定","scope":"国家","issuer":"国务院","doc_no":"国务院令第844号","nature":"formal","complete":true,"original_date":"2026-08-18","repost_date":null,"effective_date":"2026-09-20","source_url":"https://www.changzhi.gov.cn/xxgkml/zfxxgkml/szfzssydw/czszfgjj/gkgd_202/202608/t20260825_3199027.shtml","collection_track":"baseline","issued_date":"2026-08-10","source_issuer":"国务院","date_eligible":true,"policy_id":"f3d59431a1269a877fbc74cc8f7acd1b","reference_cities":["北京","天津","石家庄","三亚","陵水"],"channels":["national","fund"],"official_sources":[{"version_id":"0b8562fefaf1b18a1d726671975d980e","title":"国务院关于修改《住房公积金管理条例》的决定","original_date":"2026-08-18","repost_date":null,"channel":"national","channel_label":"国家部委","complete":true,"url":"https://www.changzhi.gov.cn/xxgkml/zfxxgkml/szfzssydw/czszfgjj/gkgd_202/202608/t20260825_3199027.shtml","attachment_count":0},{"version_id":"435bfb2eb050a7de96e43f871bdfec84","title":"国务院关于修改《住房公积金管理条例》的决定","original_date":"2026-08-18","repost_date":"2026-09-18","channel":"fund","channel_label":"公积金","complete":false,"url":"https://www.sjzgjj.cn/gjjwj/2486.jhtml","attachment_count":1}],"topic_ids":["support_fund_loan_limit"],"topic_details":{"support_fund_loan_limit":{"version_id":"0b8562fefaf1b18a1d726671975d980e","scope":"国家","title":"国务院关于修改《住房公积金管理条例》的决定","original_date":"2026-08-18","summary":"（三）确定住房公积金的最高贷款额度；","scope_label":"国家基准 / 参考","policy_id":"f3d59431a1269a877fbc74cc8f7acd1b","personal_key":"family:b41667177a128670636a8d5f0fe604f91833572a1593f70044951b657bbb0ac5"}},"summary":"《国务院关于修改〈住房公积金管理条例〉的决定》已经2026年7月31日国务院第93次常务会议通过，现予公布，自2026年9月20日起施行。\n\n一、 在第一条中的“维护住房公积金所有者的合法权益”后增加“更好满足多样化住房消费需求”。","summary_available":true,"library_status":"mapped","library_status_label":"已关联事项","source_conflict":false,"nature_label":"正式文件","evidence_status_label":"正式文件；效期另看原文依据","scope_level":"national","scope_label":"国家基准 / 参考","record_kind":"policy","formal_policy_count":1,"parent_policy_id":null,"personal_key":"family:b41667177a128670636a8d5f0fe604f91833572a1593f70044951b657bbb0ac5"}],"references":[{"version_id":"1616f5f394b30424c1f630dbf217b882","title":"住房公积金贷款政策解读","scope":"石家庄","issuer":null,"doc_no":null,"nature":"explanation","complete":true,"original_date":"2026-09-18","repost_date":null,"effective_date":null,"source_url":"https://www.sjzgjj.cn/zecjd/2491.jhtml","collection_track":"delta","issued_date":null,"source_issuer":"石家庄住房公积金管理中心","date_eligible":true,"policy_id":"f1bd2e5af0fdb3d8853ef627ac568e52","reference_cities":[],"channels":["fund"],"official_sources":[{"version_id":"1616f5f394b30424c1f630dbf217b882","title":"住房公积金贷款政策解读","original_date":"2026-09-18","repost_date":null,"channel":"fund","channel_label":"公积金","complete":true,"url":"https://www.sjzgjj.cn/zecjd/2491.jhtml","attachment_count":1}],"topic_ids":[],"topic_details":{},"summary":"一、问：办理住房公积金贷款住房套数认定范围是什么？ \n答：以缴存人家庭（家庭成员范围包括购房人、配偶以及\n未成年子女，下同）为单位计算，缴存人家庭购买长安区、桥\n西区、新华区、裕华区、高新区范围内住房的，其住房套数认\n定范围调整为拟购住房所在行政区。缴存人家庭申请贷款时，\n只核查拟购住房所在行政区住房，其他区域住房不计入住房套\n数。 \n例：小明缴存住房公积金，在桥西区、新华区各有一套自\n住住房，家庭名下在长安区没有住房。现小明申请购买长安区\n住房，在申请公积金贷款时，视为购买首套住房。 \n二、问：住房套数认定标准是什么？ \n答：（一）缴存人家庭符合下列情形之一，能提供相应证\n明材料的，可核减一套住房套数。同时符合多种情形的，仅核\n减一套，不叠加核减。1.多子女家庭的，提供子女户口本和出\n生医学证明；2.持有效石家庄市人才绿卡A卡、B卡的，提供石\n家庄市人才绿卡A卡或B卡；3.购买我市二星级及以上新建绿色\n建筑或被动式超低能耗住房的，以公积金贷款项目准入时房地\n产开发企业提供的材料为准，借款申请人无需提供。\n\n（二）缴存人家庭住房套数，按购房所在县（市、区）实\n际拥有套数核减后认定，核减后仍认定为两套及以上的，不予\n受理住房公积金贷款申请。 \n（三）缴存人家庭申请住房公积金贷款(包含商品房、二手\n房和“商转公”贷款)时，在全国范围内无未结清住房公积金贷\n款的，且经认定符合贷款条件的，执行首套房贷政策，不再受\n住房公积金贷款使用次数限制。 \n例：1.小王在我市桥西区拥有一套公积金贷款已结清的自\n住住房，现拟在桥西区再次购买自住住房，申请公积金贷款时，\n按首套住房政策执行。 \n2.小刘符合多子女家庭认定条件，在我市裕华区有两套公\n积金贷款均已结清的自住住房，现拟在裕华区再次购买自住住\n房，经中心认定核减一套住房后，申请公积金贷款时，按首套\n住房政策执行。 \n3.小张在我市裕华区有两套自住住房，现拟将其中一套正\n在偿还商业贷款的自住住房转为公积金贷款，申请“商转公”\n时，按首套住房政策执行。 \n三、问：申请主城区（长安区、桥西区、新华区、裕华区、\n高新区）住房公积金贷款，还需补充提供什么材料？ \n答：（一）主城区住房套数为零套、一套的，借款人无需\n额外提供住房证明材料。","summary_available":true,"library_status":"unmapped","library_status_label":"待关联事项","source_conflict":false,"nature_label":"政策解读","evidence_status_label":"政策解读","scope_level":"local","scope_label":"石家庄","record_kind":"reference","formal_policy_count":0,"parent_policy_id":"7779d67f573c5ff0612390625ab90357","reference_status":"linked","reference_status_label":"正式文件的配套解读","parent_title":"关于调整住房公积金贷款有关政策的通知","personal_key":"family:8e24f2740336f7b9145078eae3ae3192eff88bac87f0d5e10bf6178cd585ded8"},{"version_id":"1a7c16299a64ba19ac007afdb9349049","title":"住房公积金装修提取政策解读","scope":"石家庄","issuer":null,"doc_no":null,"nature":"explanation","complete":true,"original_date":"2026-09-18","repost_date":null,"effective_date":null,"source_url":"https://www.sjzgjj.cn/zecjd/2490.jhtml","collection_track":"delta","issued_date":null,"source_issuer":"石家庄住房公积金管理中心","date_eligible":true,"policy_id":"0079664d84ad542183332e43fadc1026","reference_cities":[],"channels":["fund"],"official_sources":[{"version_id":"1a7c16299a64ba19ac007afdb9349049","title":"住房公积金装修提取政策解读","original_date":"2026-09-18","repost_date":null,"channel":"fund","channel_label":"公积金","complete":true,"url":"https://www.sjzgjj.cn/zecjd/2490.jhtml","attachment_count":1}],"topic_ids":[],"topic_details":{},"summary":"一、哪些人可以申请办理装修提取住房公积金业务？ \n答：石家庄住房公积金缴存人本人及其配偶，可申请办理\n装修提取住房公积金业务。 \n二、房子需要满足哪些条件？ \n答：申请装修提取住房公积金的房产须为石家庄市行政区\n域内的自住住房，符合下列条件之一的，可申请办理： \n（一）取得不动产权证书或房屋所有权证满 10 年的自住住\n房； \n（二）2026 年 9 月20日（含）以后，取得不动产权证书的\n自住住房。 \n三、装修提取能提多少钱？ \n答：每个缴存人提取金额最高不超过 15 万元。 \n四、装修提取可以办理几次？ \n答：每个缴存人只可申请一次装修提取。 \n五、同一套房产允许几个人办理装修提取？ \n答：同一套住房在房产持有期间，最多允许两人办理装修\n提取。 \n六、房产取得时间以什么为准？ \n答：申请装修提取的自住住房，房产取得时间以证件登记\n\n时间为准。 \n七、换过不动产权证书，房产取得时间怎么认定？ \n答：因补发、变更、析产等原因换发不动产权证书的，房\n产取得时间以产权人首次取得该套住房的登记时间认定。 \n八、装修提取住房公积金有哪些办理渠道？ \n答：装修提取住房公积金设有线上、线下两种办理渠道。 \n九、装修提取住房公积金需要哪些材料？ \n答：（一）线下窗口办理 \n缴存人需提供不动产权证书或房屋所有权证、本人有效身\n份证件、Ⅰ类银行卡（现支持工商、农业、中国、建设、交通\n银行）申请办理；作为配偶提取的，另需提供产权人有效身份\n证件及婚姻关系证明材料。 \n（二）线上全程网办 \n能够通过信息联网核查提取条件的，可通过“手机公积金”\nAPP 全程网上办理。 \n十、装修提取住房公积金政策什么时候开始施行？ \n答：自 2026 年 9 月 20 日起施行。","summary_available":true,"library_status":"unmapped","library_status_label":"待关联事项","source_conflict":false,"nature_label":"政策解读","evidence_status_label":"政策解读","scope_level":"local","scope_label":"石家庄","record_kind":"reference","formal_policy_count":0,"parent_policy_id":"563dc1cfefbba1c8c137b33c353eb8cc","reference_status":"linked","reference_status_label":"正式文件的配套解读","paren async function api(path, body) {
  if(online)return online.api(path,body);
  const headers = {'Accept':'application/json'};
  const options = {method:body === undefined ? 'GET' : 'POST',headers,credentials:'same-origin',cache:'no-store'};
  if (body !== undefined) { headers['Content-Type']='application/json'; headers['X-Policy-Token']=token; options.body=JSON.stringify(body); }
  const response = await fetch(path,options);
  let payload; try { payload=await response.json(); } catch { throw new Error(`服务返回非 JSON 内容（${response.status}）`); }
  if (!response.ok) throw new Error(payload.error || payload.message || `请求失败（${response.status}）`);
  return payload;
}
